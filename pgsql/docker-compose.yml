version: '3.8'

services:
  postgres:
    image: postgres:alpine3.20
    container_name: postgres-container
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: devUser
      POSTGRES_PASSWORD: isMysecret98
    ports:
      - "5432:5432"
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d
